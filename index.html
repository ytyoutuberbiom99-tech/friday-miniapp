<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0d1b3e 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .reactor-container {
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
            position: relative;
        }
        
        .reactor-svg {
            width: 100%;
            height: 100%;
            animation: reactorGlow 2s ease-in-out infinite;
        }
        
        @keyframes reactorGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.8)); }
            50% { filter: drop-shadow(0 0 40px rgba(0, 212, 255, 1)); }
        }
        
        .reactor-core {
            animation: corePulse 1.5s ease-in-out infinite;
        }
        
        @keyframes corePulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }
        
        .ring-rotate {
            animation: ringSpin 4s linear infinite;
            transform-origin: center;
        }
        
        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }
        
        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        
        .subtitle {
            font-size: 12px;
            letter-spacing: 4px;
            color: #00d4ff;
            opacity: 0.7;
            margin-bottom: 50px;
        }
        
        .startBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 25px;
            padding: 15px 50px;
            font-size: 16px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .startBtn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.9); 
        }
        
        #mainApp { 
            display: none; 
            height: 100vh; 
            flex-direction: column; 
        }
        
        .header {
            background: linear-gradient(180deg, #0d1b3e 0%, #000 100%);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 18px;
        }
        
        .userName { font-size: 15px; font-weight: 600; }
        .userStatus { font-size: 11px; color: #00d4ff; }
        
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            color: #000;
        }
        
        .ai {
            align-self: flex-start;
            background: rgba(13, 27, 62, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .inputArea {
            padding: 15px 20px;
            background: #000;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            gap: 10px;
        }
        
        #msgInput {
            flex: 1;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        
        #msgInput:focus { border-color: #00d4ff; }
        
        #sendBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        #sendBtn svg { width: 20px; height: 20px; fill: #000; }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="reactor-container">
            <svg class="reactor-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Внешний корпус (треугольник) -->
                <polygon points="100,20 180,160 20,160" fill="none" stroke="#4a5568" stroke-width="4"/>
                <polygon points="100,30 170,150 30,150" fill="none" stroke="#718096" stroke-width="2"/>
                
                <!-- Внутренняя структура -->
                <polygon points="100,50 155,140 45,140" fill="none" stroke="#2d3748" stroke-width="3"/>
                
                <!-- Голубое свечение внутри -->
                <polygon points="100,60 145,135 55,135" fill="rgba(0, 212, 255, 0.2)" stroke="#00d4ff" stroke-width="1"/>
                
                <!-- Центральное ядро (треугольник) -->
                <polygon points="100,75 130,125 70,125" fill="url(#coreGradient)" class="reactor-core"/>
                
                <!-- Внутренние линии -->
                <line x1="100" y1="75" x2="100" y2="125" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
                <line x1="70" y1="125" x2="130" y2="125" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
                <line x1="100" y1="75" x2="70" y2="125" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
                <line x1="100" y1="75" x2="130" y2="125" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
                
                <!-- Вращающиеся элементы -->
                <g class="ring-rotate">
                    <circle cx="100" cy="100" r="70" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="10 5" opacity="0.6"/>
                    <circle cx="100" cy="100" r="80" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="5 10" opacity="0.4"/>
                </g>
                
                <!-- Угловые детали -->
                <circle cx="100" cy="20" r="5" fill="#4a5568" stroke="#718096" stroke-width="1"/>
                <circle cx="180" cy="160" r="5" fill="#4a5568" stroke="#718096" stroke-width="1"/>
                <circle cx="20" cy="160" r="5" fill="#4a5568" stroke="#718096" stroke-width="1"/>
                
                <!-- Градиент для ядра -->
                <defs>
                    <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.7" />
                    </radialGradient>
                </defs>
            </svg>
        </div>
        <div class="title">F.R.I.D.A.Y.</div>
        <div class="subtitle">TOPOVSK INDUSTRIES</div>
        <button class="startBtn" onclick="startApp()">START</button>
    </div>

    <div id="mainApp">
        <div class="header">
            <div class="avatar" id="avatar">T</div>
            <div>
                <div class="userName" id="userName">User</div>
                <div class="userStatus" id="userStatus">TOPOVSK INDUSTRIES</div>
            </div>
        </div>
        
        <div id="chat">
            <div class="message ai" style="text-align:center;padding:25px 20px;">
                <div style="font-size:40px;margin-bottom:10px;">&#x1F537;</div>
                <div style="font-size:18px;font-weight:600;margin-bottom:5px;">Welcome, boss</div>
                <div style="color:#00d4ff;font-size:13px;">All systems active<br>Ready to work</div>
            </div>
        </div>
        
        <div class="inputArea">
            <input type="text" id="msgInput" placeholder="Type message..." autocomplete="off">
            <button id="sendBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById("userName").textContent = user.first_name;
            document.getElementById("userStatus").textContent = "ID: " + user.id;
            document.getElementById("avatar").textContent = user.first_name[0].toUpperCase();
        }
        
        function startApp() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("mainApp").style.display = "flex";
            setTimeout(function() {
                addMessage("ai", " F.R.I.D.A.Y. online. All systems active. Ready to work, boss!");
            }, 500);
        }
        
        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        
        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function send() {
            const text = msgInput.value.trim();
            if (!text) return;
            addMessage("user", text);
            msgInput.value = "";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            
            try {
                tg.sendData(JSON.stringify({type: "message", text: text, userId: user ? user.id : null}));
                setTimeout(function() {
                    addMessage("ai", "✅ Message sent. Reply will come in chat.");
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                }, 1000);
            } catch (e) {
                addMessage("ai", "❌ Error: " + e.message);
                msgInput.disabled = false;
                sendBtn.disabled = false;
            }
        }
        
        sendBtn.onclick = send;
        msgInput.onkeypress = function(e) { if (e.key === "Enter") send(); };
    </script>
</body>
</html>
