<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0d1b3e 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .reactor {
            width: 150px;
            height: 150px;
            margin-bottom: 40px;
            position: relative;
        }
        
        .center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: radial-gradient(circle, #fff 0%, #00d4ff 40%, #0066cc 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #00d4ff, 0 0 80px #00d4ff;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }
        
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(0, 212, 255, 0.4);
            border-radius: 50%;
        }
        
        .ring1 { 
            width: 80px; height: 80px; 
            border-top-color: #00d4ff; 
            animation: spin 2s linear infinite; 
        }
        .ring2 { 
            width: 120px; height: 120px; 
            border-right-color: #00d4ff; 
            animation: spin 3s linear infinite reverse; 
        }
        .ring3 { 
            width: 150px; height: 150px; 
            border-bottom-color: #00d4ff; 
            animation: spin 4s linear infinite; 
        }
        
        @keyframes spin { 
            to { transform: translate(-50%, -50%) rotate(360deg); } 
        }
        
        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        
        .subtitle {
            font-size: 12px;
            letter-spacing: 4px;
            color: #00d4ff;
            opacity: 0.7;
            margin-bottom: 50px;
        }
        
        .startBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 25px;
            padding: 15px 50px;
            font-size: 16px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .startBtn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.9); 
        }
        
        #mainApp { 
            display: none; 
            height: 100vh; 
            flex-direction: column; 
        }
        
        .header {
            background: linear-gradient(180deg, #0d1b3e 0%, #000 100%);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 18px;
        }
        
        .userName { font-size: 15px; font-weight: 600; }
        .userStatus { font-size: 11px; color: #00d4ff; }
        
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            color: #000;
        }
        
        .ai {
            align-self: flex-start;
            background: rgba(13, 27, 62, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .inputArea {
            padding: 15px 20px;
            background: #000;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            gap: 10px;
        }
        
        #msgInput {
            flex: 1;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        
        #msgInput:focus { border-color: #00d4ff; }
        
        #sendBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        #sendBtn svg { width: 20px; height: 20px; fill: #000; }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="reactor">
            <div class="center"></div>
            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>
        </div>
        <div class="title">F.R.I.D.A.Y.</div>
        <div class="subtitle">TOPOVSK INDUSTRIES</div>
        <button class="startBtn" onclick="startApp()">START</button>
    </div>

    <div id="mainApp">
        <div class="header">
            <div class="avatar" id="avatar">T</div>
            <div>
                <div class="userName" id="userName">User</div>
                <div class="userStatus" id="userStatus">TOPOVSK INDUSTRIES</div>
            </div>
        </div>
        
        <div id="chat">
            <div class="message ai" style="text-align:center;padding:25px 20px;">
                <div style="font-size:40px;margin-bottom:10px;">&#x1F537;</div>
                <div style="font-size:18px;font-weight:600;margin-bottom:5px;">Welcome, boss</div>
                <div style="color:#00d4ff;font-size:13px;">All systems active<br>Ready to work</div>
            </div>
        </div>
        
        <div class="inputArea">
            <input type="text" id="msgInput" placeholder="Type message..." autocomplete="off">
            <button id="sendBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById("userName").textContent = user.first_name;
            document.getElementById("userStatus").textContent = "ID: " + user.id;
            document.getElementById("avatar").textContent = user.first_name[0].toUpperCase();
        }
        
        function startApp() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("mainApp").style.display = "flex";
            setTimeout(function() {
                addMessage("ai", " F.R.I.D.A.Y. online. All systems active. Ready to work, boss!");
            }, 500);
        }
        
        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        
        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function send() {
            const text = msgInput.value.trim();
            if (!text) return;
            addMessage("user", text);
            msgInput.value = "";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            
            try {
                tg.sendData(JSON.stringify({type: "message", text: text, userId: user ? user.id : null}));
                setTimeout(function() {
                    addMessage("ai", "✅ Message sent. Reply will come in chat.");
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                }, 1000);
            } catch (e) {
                addMessage("ai", "❌ Error: " + e.message);
                msgInput.disabled = false;
                sendBtn.disabled = false;
            }
        }
        
        sendBtn.onclick = send;
        msgInput.onkeypress = function(e) { if (e.key === "Enter") send(); };
    </script>
</body>
</html>
