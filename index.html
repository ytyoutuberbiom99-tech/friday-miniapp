<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .arc-reactor {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 50px;
        }
        
        .reactor-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: radial-gradient(circle, #fff 0%, #00d4ff 30%, #0066cc 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #00d4ff, 0 0 120px #00d4ff, inset 0 0 20px #fff;
            animation: reactorPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes reactorPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 60px #00d4ff, 0 0 120px #00d4ff, inset 0 0 20px #fff;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 0 0 80px #00d4ff, 0 0 160px #00d4ff, inset 0 0 30px #fff;
            }
        }
        
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 50%;
        }
        
        .ring:nth-child(2) {
            width: 100px; height: 100px;
            border-top-color: #00d4ff;
            border-bottom-color: transparent;
            animation: rotate 2s linear infinite;
        }
        
        .ring:nth-child(3) {
            width: 140px; height: 140px;
            border-left-color: #00d4ff;
            border-right-color: transparent;
            animation: rotate 3s linear infinite reverse;
        }
        
        .ring:nth-child(4) {
            width: 180px; height: 180px;
            border-top-color: #00d4ff;
            border-bottom-color: transparent;
            animation: rotate 4s linear infinite;
        }
        
        @keyframes rotate {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .title {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #fff 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        
        .subtitle {
            font-size: 14px;
            letter-spacing: 6px;
            color: #00d4ff;
            margin-bottom: 60px;
            opacity: 0.8;
        }
        
        .startBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 30px;
            padding: 18px 70px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            transition: all 0.3s;
            letter-spacing: 3px;
        }
        
        .startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.9);
        }
        
        .startBtn:active { transform: scale(0.98); }
        
        #mainApp {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(180deg, #0d1b3e 0%, #000 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }
        
        .userName { font-size: 16px; font-weight: 600; color: #fff; }
        .userStatus { font-size: 11px; color: #00d4ff; }
        
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        
        .ai {
            align-self: flex-start;
            background: rgba(13, 27, 62, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-bottom-left-radius: 4px;
        }
        
        .inputArea {
            padding: 16px 20px;
            background: #000;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            gap: 10px;
        }
        
        #msgInput {
            flex: 1;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 26px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        
        #msgInput:focus { border-color: #00d4ff; }
        
        #sendBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #0066cc 100%);
            border: none;
            border-radius: 50%;
            width: 52px; height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        #sendBtn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(0, 212, 255, 0.8); }
        #sendBtn:active { transform: scale(0.95); }
        #sendBtn svg { width: 22px; height: 22px; fill: #000; }
        
        .typing { display: flex; gap: 5px; padding: 14px 18px; }
        .typing span {
            width: 8px; height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="arc-reactor">
            <div class="reactor-center"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>
        <div class="title">F.R.I.D.A.Y.</div>
        <div class="subtitle">TOPOVSK INDUSTRIES</div>
        <button class="startBtn" onclick="startApp()">НАЧАТЬ</button>
    </div>

    <div id="mainApp">
        <div class="header">
            <div class="avatar" id="avatar">T</div>
            <div>
                <div class="userName" id="userName">Topovsk</div>
                <div class="userStatus" id="userStatus">TOPOVSK INDUSTRIES</div>
            </div>
        </div>
        
        <div id="chat">
            <div class="message ai" style="text-align:center;padding:30px 20px;">
                <div style="font-size:48px;margin-bottom:15px;">🔷</div>
                <h2 style="margin-bottom:8px;">Добро пожаловать, босс</h2>
                <p style="color:#00d4ff;font-size:13px;">Все системы активны. Готова к работе.<br>Чем могу помочь?</p>
            </div>
        </div>
        
        <div class="inputArea">
            <input type="text" id="msgInput" placeholder="Запрос, босс..." autocomplete="off">
            <button id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById("userName").textContent = user.first_name;
            document.getElementById("userStatus").textContent = "ID: " + user.id;
            document.getElementById("avatar").textContent = user.first_name[0].toUpperCase();
        }
        
        function startApp() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("mainApp").style.display = "flex";
            
            setTimeout(function() {
                addMessage("ai", "🔷 F.R.I.D.A.Y. онлайн. Все системы активны. Готова к работе, босс!");
            }, 500);
        }
        
        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        
        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function showTyping() {
            const div = document.createElement("div");
            div.className = "message ai typing";
            div.id = "typing";
            div.innerHTML = "<span></span><span></span><span></span>";
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }
        
        function send() {
            const text = msgInput.value.trim();
            if (!text) return;
            
            addMessage("user", text);
            msgInput.value = "";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            showTyping();
            
            try {
                tg.sendData(JSON.stringify({
                    type: "message",
                    text: text,
                    userId: user ? user.id : null,
                    timestamp: Date.now()
                }));
                
                setTimeout(function() {
                    removeTyping();
                    addMessage("ai", "✅ Сообщение отправлено. Ответ придёт в чат.");
                }, 1500);
            } catch (e) {
                removeTyping();
                addMessage("ai", "❌ Ошибка: " + e.message);
            } finally {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.focus();
            }
        }
        
        sendBtn.onclick = send;
        msgInput.onkeypress = function(e) {
            if (e.key === "Enter") send();
        };
    </script>
</body>
</html>
