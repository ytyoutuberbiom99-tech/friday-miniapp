<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0a0e27; color: #fff; height: 100vh; overflow: hidden; }
        
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0d1b3e 0%, #0a0e27 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .reactor {
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
            position: relative;
        }
        
        .reactor-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: radial-gradient(circle, #fff 0%, #00d4ff 40%, #006699 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #00d4ff, 0 0 80px rgba(0,212,255,0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }
        
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(0,212,255,0.3);
            border-radius: 50%;
        }
        
        .ring:nth-child(2) { width: 90px; height: 90px; border-top-color: #00d4ff; animation: spin 2s linear infinite; }
        .ring:nth-child(3) { width: 120px; height: 120px; border-right-color: #00d4ff; animation: spin 3s linear infinite reverse; }
        
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #00d4ff 0%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            color: rgba(0,212,255,0.6);
            margin-bottom: 50px;
        }
        
        .startBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #006699 100%);
            border: none;
            border-radius: 30px;
            padding: 16px 60px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,212,255,0.5);
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(0,212,255,0.8);
        }
        
        .startBtn:active { transform: scale(0.98); }
        
        #mainApp {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(180deg, #0d1b3e 0%, #0a0e27 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0,212,255,0.3);
        }
        
        .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff 0%, #006699 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 20px;
        }
        
        .userName { font-size: 16px; font-weight: 600; }
        .userStatus { font-size: 11px; color: #00d4ff; }
        
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff 0%, #006699 100%);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        
        .ai {
            align-self: flex-start;
            background: rgba(22,27,34,0.8);
            border: 1px solid rgba(0,212,255,0.2);
            border-bottom-left-radius: 4px;
        }
        
        .inputArea {
            padding: 16px 20px;
            background: linear-gradient(0deg, #000 0%, #0d1b3e 100%);
            border-top: 1px solid rgba(0,212,255,0.3);
            display: flex;
            gap: 10px;
        }
        
        #msgInput {
            flex: 1;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 26px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        
        #msgInput:focus { border-color: #00d4ff; }
        
        #sendBtn {
            background: linear-gradient(135deg, #00d4ff 0%, #006699 100%);
            border: none;
            border-radius: 50%;
            width: 52px; height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        #sendBtn svg { width: 22px; height: 22px; fill: #000; }
        
        .typing { display: flex; gap: 5px; padding: 14px 18px; }
        .typing span {
            width: 8px; height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- START SCREEN -->
    <div id="startScreen">
        <div class="reactor">
            <div class="reactor-core"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>
        <div class="title">F.R.I.D.A.Y.</div>
        <div class="subtitle">TOPOVSK INDUSTRIES</div>
        <button class="startBtn" onclick="startApp()">РќРђР§РђРўР¬</button>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp">
        <div class="header">
            <div class="avatar" id="avatar">T</div>
            <div>
                <div class="userName" id="userName">Topovsk</div>
                <div class="userStatus" id="userStatus">TOPOVSK INDUSTRIES</div>
            </div>
        </div>
        
        <div id="chat">
            <div class="message ai" style="text-align:center;padding:30px 20px;">
                <div style="font-size:48px;margin-bottom:15px;"></div>
                <h2 style="margin-bottom:8px;">Р”РѕР±СЂРѕ РїРѕР¶Р°Р»РѕРІР°С‚СЊ, Р±РѕСЃСЃ</h2>
                <p style="color:#00d4ff;font-size:13px;">Р’СЃРµ СЃРёСЃС‚РµРјС‹ Р°РєС‚РёРІРЅС‹. Р“РѕС‚РѕРІР° Рє СЂР°Р±РѕС‚Рµ.<br>Р§РµРј РјРѕРіСѓ РїРѕРјРѕС‡СЊ?</p>
            </div>
        </div>
        
        <div class="inputArea">
            <input type="text" id="msgInput" placeholder="Р—Р°РїСЂРѕСЃ, Р±РѕСЃСЃ..." autocomplete="off">
            <button id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById("userName").textContent = user.first_name;
            document.getElementById("userStatus").textContent = "ID: " + user.id;
            document.getElementById("avatar").textContent = user.first_name[0].toUpperCase();
        }
        
        function startApp() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("mainApp").style.display = "flex";
            
            setTimeout(function() {
                addMessage("ai", "рџ”· F.R.I.D.A.Y. РѕРЅР»Р°Р№РЅ. Р’СЃРµ СЃРёСЃС‚РµРјС‹ Р°РєС‚РёРІРЅС‹. Р“РѕС‚РѕРІР° Рє СЂР°Р±РѕС‚Рµ, Р±РѕСЃСЃ!");
            }, 500);
        }
        
        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        
        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function showTyping() {
            const div = document.createElement("div");
            div.className = "message ai typing";
            div.id = "typing";
            div.innerHTML = "<span></span><span></span><span></span>";
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }
        
        function send() {
            const text = msgInput.value.trim();
            if (!text) return;
            
            addMessage("user", text);
            msgInput.value = "";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            showTyping();
            
            try {
                tg.sendData(JSON.stringify({
                    type: "message",
                    text: text,
                    userId: user ? user.id : null,
                    timestamp: Date.now()
                }));
                
                setTimeout(function() {
                    removeTyping();
                    addMessage("ai", "вњ… РЎРѕРѕР±С‰РµРЅРёРµ РѕС‚РїСЂР°РІР»РµРЅРѕ. РћС‚РІРµС‚ РїСЂРёРґС‘С‚ РІ С‡Р°С‚.");
                }, 1500);
            } catch (e) {
                removeTyping();
                addMessage("ai", "вќЊ РћС€РёР±РєР°: " + e.message);
            } finally {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.focus();
            }
        }
        
        sendBtn.onclick = send;
        msgInput.onkeypress = function(e) {
            if (e.key === "Enter") send();
        };
    </script>
</body>
</html>
