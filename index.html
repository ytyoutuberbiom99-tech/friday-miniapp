<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0d1117; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(180deg, #1a2332 0%, #0d1117 100%); padding: 15px 20px; border-bottom: 1px solid #00d4ff; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff 0%, #006699 100%); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 18px; box-shadow: 0 0 20px rgba(0,212,255,0.6); }
        .user-info h2 { font-size: 16px; margin-bottom: 3px; }
        .user-info p { font-size: 11px; color: #00d4ff; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user { align-self: flex-end; background: linear-gradient(135deg, #00d4ff 0%, #006699 100%); color: #000; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: #161b22; border: 1px solid #30363d; border-bottom-left-radius: 4px; }
        .input-area { padding: 15px 20px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        #msg-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; }
        #msg-input:focus { border-color: #00d4ff; }
        #send-btn { background: #00d4ff; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #send-btn:hover { transform: scale(1.1); }
        #send-btn svg { width: 20px; height: 20px; fill: #000; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar" id="avatar">F</div>
        <div class="user-info">
            <h2 id="userName">F.R.I.D.A.Y.</h2>
            <p id="userId">STARK INDUSTRIES</p>
        </div>
    </div>
    <div id="chat">
        <div class="message ai" style="text-align: center; padding: 30px 20px;">
            <div style="font-size: 48px; margin-bottom: 15px;">🔷</div>
            <h2 style="margin-bottom: 8px;">Добро пожаловать, босс</h2>
            <p style="color: #00d4ff; font-size: 13px;">Все системы активны. Готова к работе.<br>Чем могу помочь?</p>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Запрос, босс..." autocomplete="off">
        <button id="send-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'User';
            document.getElementById('userId').textContent = 'ID: ' + user.id;
            document.getElementById('avatar').textContent = (user.first_name || 'F')[0].toUpperCase();
        }
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = chat.querySelector('.message');
        
        function addMessage(role, text) {
            if (welcome && role === 'user') welcome.remove();
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        async function send() {
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            try {
                // ОТПРАВЛЯЕМ ДАННЫЕ ПРЯМО В БОТА ЧЕРЕЗ TELEGRAM API
                tg.sendData(JSON.stringify({type: 'message', text: text, userId: user?.id, timestamp: Date.now()}));
                setTimeout(() => {
                    addMessage('ai', '✅ Сообщение отправлено. Ответ придёт в чат.');
                }, 1000);
            } catch (e) {
                addMessage('ai', '❌ Ошибка: ' + e.message);
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        sendBtn.onclick = send;
        input.onkeypress = e => { if (e.key === 'Enter') send(); };
    </script>
</body>
</html>
